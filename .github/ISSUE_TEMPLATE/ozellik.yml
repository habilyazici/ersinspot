name: Özellik önerisi
description: Yeni bir işlev veya iyileştirme önerin
labels: [özellik]
body:
  - type: textarea
    id: ihtiyac
    attributes:
      label: Hangi ihtiyacı karşılıyor?
      description: Kullanıcının yaşadığı sorunu anlatın, çözümü değil.
