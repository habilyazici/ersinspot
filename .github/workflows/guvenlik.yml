name: Güvenlik

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Her pazartesi 06:00 UTC — yeni açıklanan zafiyetleri yakalamak için.
    - cron: '0 6 * * 1'

jobs:
  bagimliliklar:
    name: Bağımlılık zafiyet taraması
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Sürüm, package.json'daki packageManager alanından okunur.
      # Burada ayrıca belirtmek ERR_PNPM_BAD_PM_VERSION hatasına yol açar.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Zafiyet taraması
        # Yüksek ve kritik seviyedeki açıklar derlemeyi başarısız kılar.
        run: pnpm audit --audit-level high

  codeql:
    name: CodeQL statik analizi
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4

  sizdirilan-sirlar:
    name: Sızdırılmış sır taraması
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks tüm geçmişi tarayabilsin diye.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
