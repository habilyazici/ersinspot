services:
  postgres:
    image: postgres:16-alpine
    container_name: ersinspot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ersinspot
      POSTGRES_PASSWORD: ersinspot_dev
      POSTGRES_DB: ersinspot
      # Türkçe sıralama ve arama için gerekli
      LANG: tr_TR.utf8
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ersinspot -d ersinspot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
