services:
  postgres:
    image: postgres:16-alpine
    container_name: ersinspot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ersinspot
      POSTGRES_PASSWORD: ersinspot_dev
      POSTGRES_DB: ersinspot
      # NOT: alpine imajı musl libc taşır ve yerel ayar tablolarını uygulamaz.
      # PostgreSQL bu değeri `datcollate` olarak kaydeder ama karşılaştırma
      # bayt sırasına düşer — "Çağrı" marka listesinde Z'den sonra gelir.
      # Türkçe sıralamayı gereken sorgular ICU harmanlamasını kendisi ister
      # (`turkishAsc`, apps/api/src/platform/db/search.ts). Değer yine de
      # veriliyor: hata mesajları ve tarih biçimleri bundan etkilenir.
      LANG: tr_TR.utf8
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ersinspot -d ersinspot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
